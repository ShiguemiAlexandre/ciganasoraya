    <style>
        :root {
            --deep-purple: #1c0f06;
            --mid-purple: #3d1708;
            --mystic-lilac: #5ee63f;
            --mystic-gold: #ffb300;
            --ethereal-white: #fbf2e4;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--deep-purple);
            color: var(--ethereal-white);
            overflow-x: hidden;
        }
        h1, h2, h3, .serif {
            font-family: 'Playfair Display', serif;
        }
        .bg-mystic-texture {
            background-image:
                radial-gradient(circle at 12% 15%, rgba(94, 230, 63, 0.025) 0%, transparent 35%),
                radial-gradient(circle at 60% 50%, rgba(255, 106, 0, 0.26) 0%, transparent 80%),
                url("https://www.transparenttextures.com/patterns/dark-matter.png");
            background-attachment: fixed;
        }
        
        .perspective-2000 { perspective: 2000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }

        /* Flip Animation */
        @keyframes flip-reveal {
            0% { transform: rotateY(180deg) scale(0.8); opacity: 0; }
            100% { transform: rotateY(0deg) scale(1); opacity: 1; }
        }

        .animate-flip {
            animation: flip-reveal 1.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        /* Floating Movement */
        @keyframes mystic-float {
            0%, 100% { transform: translateY(0) rotateX(var(--rx)) rotateY(var(--ry)); }
            50% { transform: translateY(-20px) rotateX(var(--rx)) rotateY(var(--ry)); }
        }
        .floating-card {
            animation: mystic-float 6s ease-in-out infinite;
        }

        /* Bats rising out from behind a selected card */
        @keyframes bat-rise {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
            15% { opacity: 1; }
            60% { transform: translateY(-80px) scale(1) rotate(-12deg); }
            100% { transform: translateY(-150px) scale(0.9) rotate(10deg); opacity: 0; }
        }
        .animate-bat-rise {
            animation: bat-rise 1.1s ease-out forwards;
        }

        /* Card Sheen */
        .card-glow-overlay {
            background: radial-gradient(circle at var(--x) var(--y), rgba(255, 106, 0, 0.22) 0%, transparent 50%);
            pointer-events: none;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--deep-purple); }
        ::-webkit-scrollbar-thumb { background: var(--mystic-lilac); border-radius: 10px; }
    </style>
